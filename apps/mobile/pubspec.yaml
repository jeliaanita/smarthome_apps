name: mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.0
  flutter_screenutil: ^5.9.3
  dio: ^5.9.2
  flutter_svg: ^2.2.4
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  equatable: ^2.0.8
  google_fonts: ^8.0.2
  font_awesome_flutter: ^11.0.0
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^6.2.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  mqtt_client: ^10.11.11
  provider: ^6.1.5+1
  geolocator: ^14.0.2
  cloud_firestore: ^6.7.1
  video_player: ^2.14.0
  encrypt: ^5.0.3
  crypto: ^3.0.7
  flutter_local_notifications: ^22.3.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/bg_house.png 
    - assets/icons/logo_philoin.png
    - assets/icons/google.svg
    - assets/images/cloudsun.png 
    - assets/images/house_energy.png 
    - assets/images/solar_panel.png 
    - assets/icons/icon_battery.png
    - assets/icons/icon_home.png
    - assets/icons/icon_solar_panel.png
    - assets/icons/icon_pln_source.png
    - assets/images/floor_plan.png 
    - assets/icons/icon_philoin.png



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon_philoin_padded.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/icon_philoin_padded.png"
  adaptive_icon_margin: 10